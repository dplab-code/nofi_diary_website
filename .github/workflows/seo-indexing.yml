name: SEO indexing release gates

on:
  pull_request:
    branches:
      - main
    paths:
      - app/robots.ts
      - app/sitemap.ts
      - app/manifesto/page.tsx
      - app/[locale]/manifesto/page.tsx
      - components/ExplorePages.tsx
      - lib/seo-routes.ts
      - lib/site-release.ts
      - lib/coming-soon.ts
      - tests/seo-indexing.test.mjs
      - .github/workflows/seo-indexing.yml
  push:
    branches:
      - main
      - chatgpt/seo-indexing-public-pages-20261110
    paths:
      - app/robots.ts
      - app/sitemap.ts
      - app/manifesto/page.tsx
      - app/[locale]/manifesto/page.tsx
      - components/ExplorePages.tsx
      - lib/seo-routes.ts
      - lib/site-release.ts
      - lib/coming-soon.ts
      - tests/seo-indexing.test.mjs
      - .github/workflows/seo-indexing.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    name: Next.js SEO · ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: public
            coming_soon: 'false'
            release: public
            indexable: 'true'
          - mode: coming-soon
            coming_soon: 'true'
            release: preview
            indexable: 'true'
          - mode: preview-blocked
            coming_soon: 'false'
            release: preview
            indexable: 'true'
          - mode: public-noindex
            coming_soon: 'false'
            release: public
            indexable: 'false'
    env:
      COMING_SOON: ${{ matrix.coming_soon }}
      SITE_RELEASE_MODE: ${{ matrix.release }}
      INDEXABLE: ${{ matrix.indexable }}
      SEO_EXPECTED_MODE: ${{ matrix.mode }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout candidate, no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build real Next.js metadata routes
        run: npm run build
      - name: TypeScript check
        run: npm run typecheck
      - name: Smoke-test robots, sitemap, canonical and hreflang in isolated server
        run: node tests/seo-indexing.test.mjs
